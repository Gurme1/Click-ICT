<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - ClickICT</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- EmailJS SDK - uncomment and add real keys to enable email notifications
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    -->
</head>
<body class="admin-body">
    <div class="admin-login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>ClickICT User Registration</h1>
                <p>Miseensa Haaraa Ta'uu</p>
            </div>
            
            <form id="user-register-form" class="login-form">
                <div class="form-group">
                    <label for="fullname">Maqaa Guutuu:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <button type="submit" class="btn btn-primary login-btn">Galmaa'i</button>
                
                <div id="register-message" class="error-message" style="display: none;"></div>
            </form>
            
            <div class="login-footer">
                <a href="user-login.html">Duraan miseensa? Seeni</a> | 
                <a href="../index.html">← Gara Marsariitii Deebi'i</a>
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; text-align: center; font-size: 0.8rem; color: #94a3b8;">
                    Developed by <strong style="color: #2563eb;">Gurmessa Milki</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Comments Section for Registration Page -->
    <section class="comments-section" style="padding: 60px 20px; background: #f8fafc; min-height: 50vh;">
        <div class="container" style="max-width: 800px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 2rem; color: #1e293b;">Yaada Kennaa - Registration</h2>
            
            <!-- Comment Form -->
            <div class="comment-form-container" style="margin-bottom: 3rem;">
                <form id="registration-comment-form" style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <input type="hidden" name="postId" value="registration">
                    <div class="form-group">
                        <label for="reg-comment" style="display: block; margin-bottom: 0.5rem; color: #374151; font-weight: 500;">Waa'ee Registration Yaada Kennaa:</label>
                        <textarea id="reg-comment" name="comment" required 
                            style="width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; min-height: 120px; resize: vertical;"
                            placeholder="Registration process waa'ee yaada keessan barreessaa..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        Yaada Ergi
                    </button>
                    <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.5rem; text-align: center;">
                        Yaada kennuuf duraan seenuu qabda. <a href="user-login.html" style="color: #2563eb;">Seeni</a>
                    </p>
                </form>
            </div>

            <!-- Comments Display -->
            <div id="registration-comments-container">
                <!-- Registration comments will be loaded here -->
            </div>
        </div>
    </section>
    
    <script src="../user-auth.js"></script>
    <script src="../email-service.js"></script>
    <script src="../comments.js"></script>
    <script>
        // Initialize EmailJS when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // EmailJS is handled by email-service.js — no init needed here
        });

        // Initialize registration page comment system
        document.addEventListener('DOMContentLoaded', () => {
            // Setup registration comment form
            const regCommentForm = document.getElementById('registration-comment-form');
            if (regCommentForm) {
                regCommentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    // Check if user is logged in
                    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
                    if (!currentUser) {
                        alert('Yaada kennuuf duraan seenuu qabda!');
                        window.location.href = 'user-login.html';
                        return;
                    }

                    const formData = new FormData(e.target);
                    const commentData = {
                        id: Date.now(),
                        postId: 'registration',
                        userId: currentUser.id,
                        username: currentUser.username,
                        fullname: currentUser.fullname,
                        email: currentUser.email,
                        comment: formData.get('comment'),
                        date: new Date().toISOString(),
                        isApproved: false
                    };

                    // Save comment
                    const comments = JSON.parse(localStorage.getItem('clickict_comments') || '[]');
                    comments.unshift(commentData);
                    localStorage.setItem('clickict_comments', JSON.stringify(comments));
                    
                    // Show success message
                    showRegistrationMessage('Yaadni keessan ergameera! Admin mirkaneessuu booda mul\'ata.', 'success');
                    
                    // Reset form and reload comments
                    e.target.reset();
                    loadRegistrationComments();
                });
            }
            
            // Load existing registration comments
            loadRegistrationComments();
        });

        function loadRegistrationComments() {
            const comments = JSON.parse(localStorage.getItem('clickict_comments') || '[]');
            const registrationComments = comments.filter(comment => 
                comment.isApproved && comment.postId === 'registration'
            );

            const container = document.getElementById('registration-comments-container');
            
            if (registrationComments.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: #64748b; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                        <p>Registration waa'ee yaadni hin jiru. Jalqaba ta'ii yaada kennaa!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = registrationComments.map(comment => `
                <div class="comment-item" style="background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <div class="comment-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div>
                            <strong style="color: #1e293b;">${comment.fullname}</strong>
                            <span style="color: #64748b; font-size: 0.9rem;">(@${comment.username})</span>
                        </div>
                        <span style="color: #94a3b8; font-size: 0.8rem;">${new Date(comment.date).toLocaleDateString()}</span>
                    </div>
                    <div class="comment-content" style="color: #374151; line-height: 1.6;">
                        ${comment.comment}
                    </div>
                </div>
            `).join('');
        }

        function showRegistrationMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.textContent = message;
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 16px;
                border-radius: 8px;
                z-index: 1000;
                font-weight: 500;
                ${type === 'success' ? 'background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;' : 'background: #fee2e2; color: #dc2626; border: 1px solid #fecaca;'}
            `;
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
